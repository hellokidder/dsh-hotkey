name: Update plugin market index

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate market/index.json
        run: node scripts/build-market-index.mjs
      - name: Commit the index
        run: |
          if git diff --quiet -- market/index.json; then
            echo "market index is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/index.json
          git commit -m "chore: update plugin market index"
          git push
