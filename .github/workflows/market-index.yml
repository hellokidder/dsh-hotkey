name: Update plugin market index

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # awesome-dsh-plugin only lists repos carrying the `dsh-plugin` topic, and losing
      # it is silent. PUT replaces the whole set, so the list below is the complete
      # topic set. Best effort: GITHUB_TOKEN is not guaranteed to be allowed to edit
      # topics, and a 403 here must not fail a release.
      - name: Ensure the dsh-plugin topic
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/topics" -f 'names[]=dsh-plugin' --jq '.names'
      - name: Regenerate market/index.json
        run: node scripts/build-market-index.mjs
      - name: Commit the index
        run: |
          if git diff --quiet -- market/index.json; then
            echo "market index is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/index.json
          git commit -m "chore: update plugin market index"
          git push
